name: Amiya offline regression
on:
  push:
    branches: [codex/amiya-production]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/pi/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run setup:pi
      - run: npm run test:production
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/livingmemory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/livingmemory/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt pytest==9.2.0
      - run: python -X utf8 -B -m pytest
