name: Memory service regression
on:
  push:
    branches: [main, codex/main-memory-service]
    paths:
      - services/livingmemory/**
      - deploy/memory-service.yml
      - .github/workflows/memory-service.yml
      - .gitattributes
  pull_request:
    paths:
      - services/livingmemory/**
      - deploy/memory-service.yml
      - .github/workflows/memory-service.yml
      - .gitattributes
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/livingmemory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/livingmemory/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt pytest==9.2.0
      - run: python -X utf8 -B -m pytest
